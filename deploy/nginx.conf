limit_conn_zone $binary_remote_addr zone=farseat_conn:10m;
limit_req_zone $binary_remote_addr zone=farseat_rate:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 21m;

    root /usr/share/nginx/html;
    index index.html;

    # pdf.js ships its worker as an ES module. Some nginx Alpine mime.types
    # versions do not register .mjs; scope the fallback to that extension so
    # the inherited MIME table for HTML, CSS, and other assets is retained.
    location ~ \.mjs$ {
        default_type application/javascript;
    }

    location /api/ {
        limit_conn farseat_conn 4;
        limit_req zone=farseat_rate burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
    }

    location = /health {
        limit_conn farseat_conn 4;
        limit_req zone=farseat_rate burst=10 nodelay;
        proxy_pass http://backend:8000/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
