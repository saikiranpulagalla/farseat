[project]
name = "farseat-backend"
version = "1.0.3"
description = "Geometry-first presentation visual-demand analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "python-multipart==0.0.29",
  "pydantic==2.13.4",
  "pdfplumber==0.11.9",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1",
  "pypdf==5.9.0",
  "reportlab==4.4.9",
  "playwright==1.57.0",
]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["app"]
