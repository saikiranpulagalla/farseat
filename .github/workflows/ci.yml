name: FarSeat CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend and validation tools
        run: python -m pip install -e 'backend[dev]'

      - name: Backend tests
        run: PYTHONPATH=backend pytest -q backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for release validation
        run: python -m playwright install --with-deps chromium

      - name: Verify clean source before release validation
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SOURCE STATUS ====="
          git status --short --untracked-files=all

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: repository became dirty before release validation"
            git diff --stat
            git diff
            exit 1
          fi

          echo "Source tree is clean."

      - name: Release validation
        run: python scripts/validate_release.py

      - name: Package ZIP
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          zip -r release/FarSeat-v1.0.3.zip . \
            -x '.git/*' \
               'frontend/node_modules/*' \
               'backend/.pytest_cache/*' \
               'release/*'

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FarSeat-v1.0.3
          path: release/FarSeat-v1.0.3.zip