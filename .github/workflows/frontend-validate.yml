name: Validate FarSeat Frontend Exact Tree
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact v1.0.2 frontend tree
        shell: bash
        run: |
          mkdir -p payload
          printf '%s' '[... ELLIPSIZATION ...]' | base64 -d | tar -xzf - -C payload
      - name: Install exact locked dependencies
        working-directory: payload/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frontend unit tests
        working-directory: payload/frontend
        run: npm test
      - name: Build production frontend
        working-directory: payload/frontend
        run: npm run build
      - name: Verify production output
        shell: bash
        run: |
          test -f payload/frontend/dist/index.html
          test -s payload/frontend/dist/index.html
