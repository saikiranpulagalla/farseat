name: Validate FarSeat Frontend Exact Tree
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact v1.0.2 frontend source
        shell: bash
        run: |
          mkdir -p payload
          cat ci/frontend-src.part*.b64 | base64 -d | tar -xzf - -C payload
          test -f payload/frontend/package.json

      - name: Restore exact generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: farseat-package-lock
          path: payload/frontend
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: saikiranpulagalla/farseat
          run-id: 36326827639

      - name: Verify lockfile
        shell: bash
        run: |
          test -s payload/frontend/package-lock.json

      - name: Install exact locked dependencies
        working-directory: payload/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run frontend unit tests
        working-directory: payload/frontend
        run: npm test

      - name: Build production frontend
        working-directory: payload/frontend
        run: npm run build

      - name: Verify production output
        shell: bash
        run: |
          test -f payload/frontend/dist/index.html
          test -s payload/frontend/dist/index.html
