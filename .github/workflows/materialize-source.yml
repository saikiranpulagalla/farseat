name: Recover FarSeat Source
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Explain blocked staging payload
        shell: bash
        run: |
          set -euo pipefail
          echo "The historical ci/full-src.part*.b64 staging payload is intentionally not auto-published."
          echo "It is truncated and does not reconstruct a valid gzip archive."
          echo "Use the qualified v1.0.3 release artifact as the source of truth for final publication."
          sha256sum ci/full-src.part*.b64 || true
